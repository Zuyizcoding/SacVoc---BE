name: Backend checks

# Ordinary PR event: no secrets or privileged pull_request_target workflow.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      GEMINI_API_KEY: unit-test-key
      DATABASE_URL: "sqlite://"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install lightweight dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Lint and formatting
        run: |
          ruff check app scripts tests
          ruff format --check app scripts tests
      - name: Unit and regression tests (external sockets blocked)
        # Loopback/Unix sockets support event loops and ASGI test clients.
        run: python -m pytest -q --allow-hosts=127.0.0.1,::1 --allow-unix-socket
      - name: Offline evaluation smoke checks
        run: python -m scripts.run_evaluation_smoke --output-dir build/ci-evaluation
      - name: Offline dataset/export smoke checks
        run: python -m scripts.run_data_preparation_smoke --output-dir build/ci-data
      - name: Independent annotation workflow smoke check
        run: python -m scripts.run_annotation_smoke --output-dir build/ci-annotation
      - name: Keep synthetic reports for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation-python-${{ matrix.python-version }}
          path: |
            build/ci-evaluation/
            build/ci-data/analysis-preflight/
            build/ci-data/retrieval-preflight/
            build/ci-data/export/
            build/ci-data/ablation/
            build/ci-data/smoke-summary.json
            build/ci-annotation/complete/
            build/ci-annotation/export/
            build/ci-annotation/smoke-summary.json
          if-no-files-found: ignore
          retention-days: 7

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and verify isolated runtime
        run: python -m scripts.verify_docker_runtime --build --image sacvoc-ci:local --output build/docker-verification.json
      - name: Keep runtime verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-runtime-verification
          path: build/docker-verification.json
          if-no-files-found: ignore
          retention-days: 7
